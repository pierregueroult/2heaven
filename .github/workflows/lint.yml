name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  self-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 27

      - name: Build executable jar
        run: mvn -q package -DskipTests

      - name: Run 2heaven on its own sources
        run: java -jar target/2heaven-*.jar src/main/java
